name: CI/CD Pipeline with Progressive Delivery

permissions:
  contents: read
  packages: write
  deployments: write

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_slot:
        description: "Slot to rollback to (blue/green)"
        required: false
        type: choice
        options:
          - blue
          - green
      terraform_apply:
        description: "Run Terraform apply (manual, gated)"
        required: false
        type: boolean

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
      - run: pip install flake8 black isort
      - run: |
          cd backend
          isort --check .
      - run: |
          cd backend
          black --check .
      - run: |
          cd backend
          flake8 .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: "18"
      - run: |
          cd frontend
          npm install
      - run: |
          cd frontend
          npm run lint
      - run: |
          cd frontend
          npm run format:check

  build:
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: "18"
      - uses: docker/setup-buildx-action@v3.12.0

      # Backend Tests
      - run: |
          cd backend
          pip install -r requirements.txt
      - env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest --cov=app tests/

      # Frontend Tests
      - run: |
          cd frontend
          npm install
      - run: |
          cd frontend
          npm test -- --coverage --watchAll=false

      # Build Images (also tag with GHCR names so scans and local runs match registry)
      - run: |
          docker build --no-cache -t ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-backend:ci ./backend
          docker tag ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-backend:ci genesis-backend:ci || true
      - run: |
          docker build --no-cache -t ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-frontend:ci ./frontend
          docker tag ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-frontend:ci genesis-frontend:ci || true

      # Vulnerability Scanning
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "genesis-backend:ci"
          scanners: "vuln"
          version: "v0.68.2"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "genesis-frontend:ci"
          scanners: "vuln"
          version: "v0.68.2"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_openai_api_key: "ci-placeholder"
      TF_VAR_mongo_uri: "mongodb://ci-placeholder:27017"
      TF_VAR_mongo_db: "genesis"
      TF_VAR_kubeconfig_path: "${{ github.workspace }}/.kube/config"
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: hashicorp/setup-terraform@v3.1.2
      - name: Prepare dummy kubeconfig
        run: |
          mkdir -p ${{ github.workspace }}/.kube
          cat <<EOF > ${{ github.workspace }}/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: local
          contexts:
          - context:
              cluster: local
              user: local
            name: local
          current-context: local
          users:
          - name: local
            user:
              token: dummy
          EOF
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform
      - name: Terraform init
        run: terraform init -backend=false
        working-directory: infrastructure/terraform
      - name: Terraform validate
        run: terraform validate
        working-directory: infrastructure/terraform
      - name: Terraform plan (PR only)
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false
        working-directory: infrastructure/terraform

  terraform-apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_apply == true
    environment:
      name: terraform
    env:
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
      TF_VAR_mongo_db: ${{ secrets.MONGO_DB }}
      TF_VAR_kubeconfig_path: "${{ github.workspace }}/.kube/config"
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: hashicorp/setup-terraform@v3.1.2
      - name: Set Kubeconfig
        run: |
          mkdir -p ${{ github.workspace }}/.kube
          echo "${{ secrets.KUBECONFIG }}" > ${{ github.workspace }}/.kube/config
          chmod 600 ${{ github.workspace }}/.kube/config
      - name: Terraform init
        run: terraform init
        working-directory: infrastructure/terraform
      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: infrastructure/terraform

  build-and-push:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: docker/setup-buildx-action@v3.12.0
      - name: Set GHCR token
        run: echo "GHCR_TOKEN=${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Docker meta for backend
        id: meta-backend
        uses: docker/metadata-action@v5.9.0
        with:
          images: ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Docker meta for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5.9.0
        with:
          images: ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  # ============================================================================
  # CANARY DEPLOYMENT - Deploy to inactive slot and validate metrics
  # ============================================================================

  # ============================================================================
  # CANARY DEPLOYMENT - Deploy to inactive slot and validate metrics
  # ============================================================================

  deploy-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: canary
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4.0.1
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Check Cluster Connectivity
        id: cluster
        run: |
          if kubectl cluster-info > /dev/null 2>&1; then
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
          fi

      # Deploy Canary Version (1 replica) with env substitution for IMAGE_TAG
      - name: Deploy Canary
        if: steps.cluster.outputs.reachable == 'true'
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Deploying Canary versions with tag $IMAGE_TAG..."
          # Deploy Services for Monitoring
          kubectl apply --validate=false -f k8s/backend-canary-service.yaml
          kubectl apply --validate=false -f k8s/backend-stable-service.yaml
          kubectl apply --validate=false -f k8s/frontend-canary-service.yaml
          kubectl apply --validate=false -f k8s/frontend-stable-service.yaml
          
          # Deploy Infrastructure (Redis, HPA)
          kubectl apply --validate=false -f k8s/redis-deployment.yaml
          kubectl apply --validate=false -f k8s/redis-service.yaml
          kubectl apply --validate=false -f k8s/backend-hpa.yaml
          kubectl apply --validate=false -f k8s/frontend-hpa.yaml
          
          # Deploy Canary Deployments
          envsubst < k8s/backend-canary-deployment.yaml | kubectl apply --validate=false -f -
          envsubst < k8s/frontend-canary-deployment.yaml | kubectl apply --validate=false -f -

      - name: Deploy Monitoring (Prometheus/Grafana)
        if: steps.cluster.outputs.reachable == 'true'
        run: |
          kubectl apply --validate=false -f k8s/monitoring/prometheus.yaml
          kubectl apply --validate=false -f k8s/monitoring/grafana.yaml

      # Wait for Canary to be ready
      - name: Wait for Canary Rollout
        if: steps.cluster.outputs.reachable == 'true'
        run: |
          echo "Waiting for canary deployments to be ready..."
          kubectl rollout status deployment/llm-backend-canary --timeout=60s
          kubectl rollout status deployment/llm-frontend-canary --timeout=60s

      # Verify Metrics (Port-forward Prometheus)
      - name: Verify Canary Metrics
        if: steps.cluster.outputs.reachable == 'true'
        run: |
          echo "Setting up port-forward to Prometheus..."
          # Start port-forward in background
          kubectl port-forward svc/prometheus-service 9090:9090 &
          PID=$!
          
          echo "Waiting for connection..."
          sleep 5

          echo "Validating metrics..."
          chmod +x scripts/check-canary-metrics.sh
          
          echo "--- Checking Backend Metrics ---"
          METRICS_RELAXED=1 ./scripts/check-canary-metrics.sh 'job="llm-backend-canary"' 'job="llm-backend-stable"' "http://localhost:9090"
          
          echo "--- Checking Frontend Metrics ---"
          METRICS_RELAXED=1 ./scripts/check-canary-metrics.sh 'job="llm-frontend-canary"' 'job="llm-frontend-stable"' "http://localhost:9090"
          
          # Kill port-forward
          kill $PID

      - name: Skip Canary (No Cluster)
        if: steps.cluster.outputs.reachable != 'true'
        run: |
          echo "Skipping canary deploy: cluster unreachable via KUBECONFIG."

  # ============================================================================
  # PRODUCTION PROMOTION - Rolling Update
  # ============================================================================

  promote-to-production:
    needs: [deploy-canary, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4.0.1
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Apply Stable Manifests (Rolling Update)
      - name: Deploy Stable Rolling Update
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "Promoting to stable (Rolling Update) with tag $IMAGE_TAG..."
          envsubst < k8s/backend-deployment.yaml | kubectl apply -f -
          envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
          envsubst < k8s/worker-deployment.yaml | kubectl apply -f -
          
          echo "Waiting for stable rollout..."
          kubectl rollout status deployment/llm-backend --timeout=60s
          kubectl rollout status deployment/llm-frontend --timeout=60s
          kubectl rollout status deployment/llm-worker --timeout=60s

      # Cleanup Canary
      - name: Remove Canary
        run: |
          echo "Removing canary deployments..."
          kubectl delete -f k8s/backend-canary-deployment.yaml --ignore-not-found=true
          kubectl delete -f k8s/frontend-canary-deployment.yaml --ignore-not-found=true

      - name: Deployment Complete
        run: |
          echo "✅ Rolling Update Complete!"

  # ============================================================================
  # ROLLBACK - Kubernetes Rollout Undo
  # ============================================================================

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4.0.1
        with:
          version: 'latest'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback Deployment
        run: |
          echo "Rolling back backend and frontend..."
          kubectl rollout undo deployment/llm-backend
          kubectl rollout undo deployment/llm-frontend
          
          echo "Waiting for rollback..."
          kubectl rollout status deployment/llm-backend --timeout=60s
          kubectl rollout status deployment/llm-frontend --timeout=60s
          
          echo "✅ Rollback Complete"
