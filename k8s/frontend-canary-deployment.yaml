apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-frontend-canary
  labels:
    app: llm-frontend
    version: canary
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: llm-frontend
      version: canary
  template:
    metadata:
      labels:
        app: llm-frontend
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: llm-frontend
          image: ghcr.io/kieranarchi98/devops-ci-cd-automated-pipeline-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 80
